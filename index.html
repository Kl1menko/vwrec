<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="generator" content="VW Recruit Starter" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta http-equiv="refresh" content="0; url=/uk/" />
    <title>VW Recruit</title>
  </head>
  <body>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fafafa;
        color: #111111;
        font-family: Inter, sans-serif;
      }

      .redirect-loader {
        display: grid;
        justify-items: center;
        gap: 18px;
        padding: 24px;
        text-align: center;
      }

      .redirect-loader__logo {
        width: 60px;
        height: auto;
      }

      .redirect-loader__spinner {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        border: 2px solid rgba(242, 122, 36, 0.18);
        border-top-color: #f27a24;
        animation: redirect-spin 0.8s linear infinite;
      }

      .redirect-loader__text {
        font-size: 0.92rem;
        line-height: 1.5;
        color: #5f5b57;
      }

      .redirect-loader__text a {
        color: #d95d0a;
      }

      @keyframes redirect-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <div class="redirect-loader" aria-live="polite">
      <img
        class="redirect-loader__logo"
        src="/logo-symbol-loader.svg"
        alt=""
        width="60"
        height="74"
      />
      <div class="redirect-loader__spinner" aria-hidden="true"></div>
    </div>
  </body>
</html>
